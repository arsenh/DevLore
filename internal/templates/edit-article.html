{{/* templates/edit-article.html */}}
{{define "title"}}Edit Article{{end}}

{{define "content"}}
<div class="container">
  <h2>Edit Article</h2>

  <form method="post" action="/articles/{{.Article.ID}}/edit" class="article-form">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" value="{{.Article.Title}}" placeholder="Enter article title" required>
    </div>

    <div class="form-group">
      <label for="content">Content</label>
      <textarea id="content" name="content" placeholder="Write your article content" rows="15" required>{{.Article.Content}}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="/articles/{{.Article.ID}}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{{end}}

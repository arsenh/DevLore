{{/* templates/login.html */}} {{define "title"}}Sign In{{end}} {{define
"content"}}
<div class="container">
    <h2>Sign In</h2>

    <form method="post" action="/auth/login" class="article-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="text"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            />
        </div>

        <div class="form-group">
            <button type="submit" class="btn btn-primary">Sign In</button>
            <a href="/auth/register" class="btn btn-secondary"
                >Create Account</a
            >
        </div>
    </form>
</div>
{{end}}

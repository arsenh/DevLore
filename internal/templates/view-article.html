{{/* templates/view-article.html */}}
{{define "title"}}{{.Article.Title}}{{end}}

{{define "content"}}
<div class="container">
  <article class="article-view">
    <h1>{{.Article.Title}}</h1>

    <p class="article-meta">
      Created: {{.Article.CreatedAt}} |
      Updated: {{.Article.UpdatedAt}}
    </p>

    <div class="article-content">
      {{.Article.Content}}
    </div>

    <div class="article-actions">
      <a href="/articles/{{.Article.ID}}/edit" class="btn btn-success">Edit</a>
      <form action="/articles/{{.Article.ID}}/delete" method="post" style="display: inline;">
        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this article?')">Delete</button>
      </form>
    </div>
  </article>
</div>
{{end}}

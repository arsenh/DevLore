{{/* templates/view-article.html */}}
{{define "title"}}{{.Article.Title}}{{end}}

{{define "content"}}
<div class="container">
  <article class="article-view">
    <h1>{{.Article.Title}}</h1>

    <p class="article-meta">
      Created: {{.Article.CreatedAt}} |
      Updated: {{.Article.UpdatedAt}}
    </p>

    <div class="article-content">
      {{.Article.Content}}
    </div>

    <div class="article-actions">
      <a href="/articles/{{.Article.ID}}/edit" class="btn btn-success">Edit</a>

      <form id="delete-form" action="/articles/{{.Article.ID}}/delete" method="post" style="display:flex;">
        <button type="button" id="open-delete-modal" class="btn btn-danger">
          Delete
        </button>
      </form>
    </div>
  </article>

  <!-- MODAL GOES HERE -->
  <div id="delete-modal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h2>Delete article?</h2>
      <p>This action cannot be undone.</p>

      <div class="modal-actions">
        <button id="cancel-delete" class="btn btn-secondary">Cancel</button>
        <button id="confirm-delete" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>
</div>{{end}}

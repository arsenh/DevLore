{{/* templates/layout.html */}} {{define "layout"}}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{block "title" .}}DevLore{{end}}</title>
        <link rel="stylesheet" href="/static/css/style.css" />
        <script src="/static/js/main.js"></script>
        <link rel="icon" type="image/png" href="/static/images/favicon.ico" />
    </head>
    <body>
        {{template "nav" .}}

        <main>{{block "content" .}}{{end}}</main>

        <footer>
            <small>© 2025</small>
        </footer>
    </body>
</html>
{{end}} {{define "nav"}}
<header>
    <nav class="navbar">
        <div class="navbar-left">
            <a href="/dashboard" class="navbar-brand">DevLore</a>
            <a href="/dashboard" class="navbar-link">Dashboard</a>
            <a href="/articles/new" class="navbar-link">New Article</a>
            <a href="/search" class="navbar-link">Search</a>
        </div>

        <div class="navbar-right">
            {{if .UserName}}
            <!-- Logged in -->
            <span class="navbar-user">{{.UserName}}</span>
            <form action="/auth/logout" method="post" class="logout-form">
                <button type="submit" class="btn btn-danger">Logout</button>
            </form>
            {{else}}
            <!-- Guest -->
            <a href="/auth/login" class="btn btn-primary">Sign In</a>
            <a href="/auth/register" class="btn btn-success">Register</a>
            {{end}}
        </div>
    </nav>
</header>
{{end}}

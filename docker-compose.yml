services:
  db:
    image: postgres:16-alpine
    container_name: devlore_host
    env_file:
      - ./.env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $POSTGRES_DB -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: devlore_app
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: ["./devlore"]

volumes:
  db_data:
